[pytest]
; Puts the project root on sys.path so tests can `from app...` import without
; needing an editable install or a pyproject.toml this project has no other
; use for.
pythonpath = .
; Restricts discovery to the real, deterministic suite. Without this, a bare
; `pytest -v` (what CI runs) also collects scripts/test_nodes.py — a Phase 3
; manual demo script that needs live API keys and was never written as a real
; pytest suite (no fixtures, no @pytest.mark.asyncio), purely because its
; function names happen to start with `test_`.
testpaths = tests
